port: 5000
maxProblems:  4                 # solver processes
maxInactivityTime:  3600        # seconds - finished problems are deleted if their results are not fetched
maxPollingPause: 600            # seconds - open problems are cancelled if their status is not requested (0: off)
serviceIntervall: 30            # seconds - interval of the cleanup
runTimeGrace: 60                # seconds - watchdog limit: maxSolvingTime + runTimeGrace
defaultMaxRunTime: 600          # seconds - watchdog limit for problems without maxSolvingTime (e.g. tsp)
maxQueueSize: 50                # open (waiting or running) problems of all keys
maxOpenProblemsPerKey: 3        # default for keys without maxOpenProblems

authentication: True            # api keys via header X-API-Key - see manageKeys.py
#apiKeyFile: /etc/logisticsLab/apiKeys.yml   # default: apiKeys.yml in the server directory
docs: False                     # /docs, /redoc and /openapi.json

logging:  True
debugging: True
#logPath: /var/log/logisticsLab   # default: directory of the server
#logMaxBytes: 5000000             # log rotation
#logBackupCount: 5

tsp:
  maxNodes: 100
  #maxRunTime: 120               # optional - fixed watchdog limit for this problem type

tpp:
  maxNodes: 200
  maxSolvingTime: 300

wlp:
  maxNodes: 200
  maxSolvingTime: 300

pmedian:
  maxNodes: 200
  maxSolvingTime: 300

pcentre:
  maxNodes: 200
  maxSolvingTime: 300

contpmedian:
  maxNodes: 200                 # customers
  maxSolvingTime: 300

contpcentre:
  maxNodes: 200                 # customers
  maxSolvingTime: 300

scp:
  maxNodes: 300
  maxSolvingTime: 300

mcp:
  maxNodes: 300
  maxSolvingTime: 300

cpp:
  maxNodes: 300                 # nodes of the graph
  maxSolvingTime: 300

vrp:
  maxNodes: 100                 # nodes incl. the depot
  maxSolvingTime: 60            # search time of OR-Tools

mincostflow:
  maxNodes: 2000
  maxSolvingTime: 120

maxflow:
  maxNodes: 2000
  maxSolvingTime: 120

multicommodity:
  maxNodes: 500
  maxSolvingTime: 300

multimodal:
  maxNodes: 300
  maxSolvingTime: 300
  

    


