
#server main configuraion file 
main_configuration: http://logisticsLab.org/logisticsLabMain.yml

#if not main_configuration or url not availabe then:
servers:
 
  matrix :
    - url: http://194.95.44.12:8082/ors/v2/matrix     
      type: ors
      #apiKey: 

    - url: http://osm1.th-wildau.de:5000/table/v1
